<script>
(async () => { applyModes(); const show = on => { const n = $('#net'); n.textContent = on ? '' : 'Offline'; n.hidden = on; };
  // navigator.onLine is unreliable (iOS, no-signal, captive Wi-Fi): confirm with a tiny network-only probe
  const net = async () => { if (!navigator.onLine) return show(false); try { const c = new AbortController(), t = setTimeout(() => c.abort(), 4000); const r = await fetch('manifest.json?probe=' + Date.now(), {cache:'no-store', signal:c.signal}); clearTimeout(t); show(r.ok); } catch (e) { show(false); } };
  addEventListener('online', net); addEventListener('offline', net); net(); setInterval(net, 30000);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const pid = localStorage.getItem('rhm_pid'); if (pid && await DB.get('projects', pid)) await setProject(pid); else await setProject(null);
  const r = (location.hash || '#home').slice(1); await go((await recoverCheck()) ? 'home' : ROUTES[r] && !['project','client'].includes(r) ? r : 'home');
  setTimeout(() => { $('#splash').classList.add('gone'); tutorial(); }, 900);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {}); })();
window.RHMAPP = { APP, PL, DB, go, SET, RHM, setProject };
